name: BTCUSDT 2024 full-year five-seed benchmark

on:
  push:
    branches:
      - 'validation/btcusdt-full-2024-five-seeds'
    paths:
      - '.github/workflows/btcusdt-2024-five-seeds.yml'
      - 'scripts/summarize_full_year.py'
      - 'src/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'

jobs:
  benchmark:
    name: Full-year train seed ${{ matrix.seed }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install research requirements
        run: python -m pip install -r requirements.txt
      - name: Verify tests before training
        run: python -m pytest -q tests
      - name: Strictly download and verify complete BTCUSDT 2024 spot history
        run: python -m scripts.prepare_btcusdt --start 2024-01 --end 2024-12
      - name: Predeclared full-year eight-model four-fold benchmark
        run: |
          python -m src.run_experiments \
            --data data/BTCUSDT_15m.csv --models phase2 \
            --window 32 --img 64 --horizon 4 --K 6 \
            --folds 4 --epochs 10 --bs 128 --bootstrap 1000 \
            --seed ${{ matrix.seed }} --out results_seed_${{ matrix.seed }}
      - name: Generate study outputs and regime diagnostics
        run: |
          python -m src.report --results results_seed_${{ matrix.seed }}
          python -m src.phase2_eval \
            --results results_seed_${{ matrix.seed }} \
            --data data/BTCUSDT_15m.csv --bootstrap 1000
      - name: Upload each seed's provenance and results even if training fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-2024-seed-${{ matrix.seed }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            data/BTCUSDT_15m.manifest.json
            results_seed_${{ matrix.seed }}/metrics.json
            results_seed_${{ matrix.seed }}/preds.npz
            results_seed_${{ matrix.seed }}/phase2_diagnostics.json
            results_seed_${{ matrix.seed }}/report.html

  summary:
    name: Verify all five seeds and aggregate
    needs: benchmark
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download seed results (also on incomplete benchmark)
        uses: actions/download-artifact@v4
        with:
          pattern: btcusdt-2024-seed-*
          path: collected
          merge-multiple: false
      - name: Check all seeds share the same exact data and benchmark configuration
        run: python -m scripts.summarize_full_year --root collected --out benchmark_summary
      - name: Add aggregate report to GitHub Actions summary
        if: success()
        run: cat benchmark_summary/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save aggregate report or explicit missing-seeds notice
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-2024-five-seed-summary
          if-no-files-found: warn
          retention-days: 30
          path: benchmark_summary/
