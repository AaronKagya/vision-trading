name: BTCUSDT Phase 3 locked 2025-Q1 holdout

on:
  push:
    branches:
      - 'validation/btcusdt-2025-holdout'
    paths:
      - '.github/workflows/btcusdt-2025-holdout.yml'
      - 'scripts/run_2025_holdout.py'
      - 'src/abstention.py'
      - 'tests/test_2025_holdout.py'
      - 'tests/test_abstention.py'
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '2'
  MKL_NUM_THREADS: '2'
  OPENBLAS_NUM_THREADS: '2'
  NUMEXPR_NUM_THREADS: '2'
  PYTHONUNBUFFERED: '1'

jobs:
  external-holdout:
    name: Train on 2024 / validate on unseen 2025-Q1
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install research dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify all unit and leakage tests
        run: python -m pytest -q tests
      - name: Download strictly validated 2024 and 2025-Q1 spot BTCUSDT data
        run: python -m scripts.prepare_btcusdt --start 2024-01 --end 2025-03
      - name: Locked 2025-Q1 LSTM holdout (no 2025 fitting)
        run: |
          python -m scripts.run_2025_holdout \
            --data data/BTCUSDT_15m.csv --seed 0 \
            --epochs 10 --bs 128 --out results_holdout_2025q1
      - name: Upload validated input hash and holdout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-2025q1-locked-holdout
          if-no-files-found: warn
          retention-days: 30
          path: |
            data/*.manifest.json
            results_holdout_2025q1/metrics.json
            results_holdout_2025q1/preds.npz
            results_holdout_2025q1/report.md
